<div class="p-6 max-w-md w-full bg-white rounded-2xl flex flex-col gap-4">
  <div class="flex items-start gap-4">
    @if (data.iconName) {
      <div
        class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0"
        [ngClass]="[
          data.iconBgColor ? data.iconBgColor : 'bg-blue-50',
          data.iconColor ? data.iconColor : 'text-[var(--mat-sys-primary)]',
        ]"
      >
        <mat-icon
          class="!w-7 !h-7 text-[28px] !leading-none !flex !items-center !justify-center text-center"
          >{{ data.iconName }}</mat-icon
        >
      </div>
    }
    <div class="flex-1">
      <h3 class="text-lg font-bold text-slate-800 tracking-tight leading-snug">
        {{ data.title }}
      </h3>
      <p class="text-slate-500 text-sm mt-1.5 leading-relaxed whitespace-pre-line">
        {{ data.content }}
      </p>
    </div>
  </div>

  <div class="flex items-center justify-end gap-3 mt-3 pt-3 border-t border-slate-100">
    <button
      mat-stroked-button
      class="rounded-lg h-10 px-6 border-slate-300! text-slate-600!"
      (click)="onCancel()"
    >
      {{ data.cancelText || 'Cancelar' }}
    </button>
    <button
      mat-flat-button
      [color]="data.confirmColor || 'primary'"
      [class]="data.customButtonClass || 'rounded-lg h-10 px-6'"
      (click)="onConfirm()"
    >
      {{ data.confirmText || 'Aceptar' }}
    </button>
  </div>
</div>
